name: apex-nexus
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure demo first}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?configure demo first}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?configure demo first}
    depends_on: { db: { condition: service_healthy } }
    command: ["python", "-m", "alembic", "-c", "services/api/alembic.ini", "upgrade", "head"]
    read_only: true
    tmpfs: [/tmp]
  seed:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?configure demo first}
      DATA_MODE: ${DATA_MODE:-demo}
    depends_on: { migrate: { condition: service_completed_successfully } }
    command: ["python", "seed/foundation.py"]
    read_only: true
    tmpfs: [/tmp]
  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment:
      DATABASE_URL: ${DATABASE_URL:?configure demo first}
      AUTH_MODE: open
      NODE_ENV: production
      I_UNDERSTAND_OPEN_MODE: ${I_UNDERSTAND_OPEN_MODE:-false}
      DATA_MODE: ${DATA_MODE:-demo}
      AI_MODE: ${AI_MODE:-deterministic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    depends_on: { seed: { condition: service_completed_successfully } }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexus-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?configure demo first}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes: ["blobs:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    environment:
      I_UNDERSTAND_OPEN_MODE: ${I_UNDERSTAND_OPEN_MODE:-false}
      API_BASE_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { api: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp, /repo/apps/web/.next/cache]
volumes:
  pgdata:
  blobs:
